<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — automatizaesto</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0B1220" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B1220'/><path d='M91.4 42.7 A42 42 0 1 1 57.3 8.6' fill='none' stroke='%23E8EDF6' stroke-width='6' stroke-linecap='round'/><circle cx='79.7' cy='20.3' r='6' fill='%2338BDF8'/><text x='50' y='64' text-anchor='middle' font-family='Arial, sans-serif' font-size='42' font-weight='700' fill='%23E8EDF6'>A<tspan fill='%2338BDF8'>e</tspan></text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B1220;
    --bg-card: #121D33;
    --border: #1E2B47;
    --ink: #E8EDF6;
    --ink-dim: #9DA9BF;
    --accent: #3B82F6;
    --grid: rgba(255,255,255,0.035);
    --serif: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --sans: 'Inter Tight', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px;
    pointer-events: none;
  }
  .card {
    position: relative;
    text-align: center;
    max-width: 560px;
    padding: 56px 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
  }
  .code {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--accent);
    letter-spacing: .2em;
    margin-bottom: 18px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    line-height: 1.15;
    margin-bottom: 14px;
  }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), #38BDF8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: var(--ink-dim); font-size: 1rem; line-height: 1.6; margin-bottom: 30px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 12px;
    font-weight: 600;
    font-size: .92rem;
    text-decoration: none;
    transition: opacity .2s, background .2s;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { opacity: .85; }
  .btn-ghost { border: 1px solid var(--border); color: var(--ink-dim); }
  .btn-ghost:hover { background: #1c1c22; color: var(--ink); }
</style>
</head>
<body>
  <main class="card">
    <div class="code">ERROR · 404</div>
    <h1>Esta página se nos <em>automatizó</em> de las manos.</h1>
    <p>La dirección que buscas no existe o fue movida. Pero lo importante sigue en su sitio.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Volver al inicio</a>
      <a class="btn btn-ghost" href="/blog/">Visitar el blog</a>
    </div>
  </main>
<script src="/assets/consent.js" defer></script>
</body>
</html>
